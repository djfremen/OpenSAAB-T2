plugins { id 'com.android.application' }

def repo = rootProject.projectDir
def generated = layout.buildDirectory.dir('generated/opensaab')
def python = providers.environmentVariable('OPENSAAB_PYTHON').getOrElse('python3')
def localInputs = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.isFile()) localFile.withInputStream { localInputs.load(it) }
def supportRoot = providers.environmentVariable('OPENSAAB_SUPPORT_ROOT')
    .getOrElse(localInputs.getProperty('opensaab.supportRoot', repo.path))
def bundleSupport = providers.gradleProperty('bundleSupport').map { it.toBoolean() }.getOrElse(false)

tasks.register('buildRust', Exec) {
    workingDir repo
    def sdk = android.sdkDirectory
    environment 'ANDROID_NDK_HOME', providers.environmentVariable('ANDROID_NDK_HOME')
        .getOrElse(new File(sdk, 'ndk/android-ndk-r29').path)
    environment 'PATH', System.getenv('PATH') + File.pathSeparator + new File(System.getProperty('user.home'), '.cargo/bin')
    commandLine 'sh', new File(repo, 'scripts/android/build-headless.sh')
}
tasks.register('buildVlinkerWorkflow', Exec) {
    workingDir repo
    environment 'ANDROID_NDK_HOME', providers.environmentVariable('ANDROID_NDK_HOME')
        .getOrElse(new File(android.sdkDirectory, 'ndk/android-ndk-r29').path)
    environment 'PATH', System.getenv('PATH') + File.pathSeparator + new File(System.getProperty('user.home'), '.cargo/bin')
    commandLine 'sh', new File(repo, 'scripts/android/build-vlinker-workflow.sh')
}
tasks.register('prepareAndroidInputs', Exec) {
    dependsOn 'buildRust', 'buildVlinkerWorkflow', 'buildRecoveredCore', 'buildMxCore', 'buildMdiMcpBridge'
    workingDir repo
    environment 'OPENSAAB_SUPPORT_ROOT', supportRoot
    environment 'OPENSAAB_VERSION_NAME', providers.gradleProperty('appVersionName').getOrElse('0.1.1-preview.11')
    environment 'OPENSAAB_VERSION_CODE', providers.gradleProperty('appVersionCode').getOrElse('101011')
    environment 'OPENSAAB_RELEASE_DATE', providers.gradleProperty('appReleaseDate').getOrElse('2026-10-19')
    commandLine python, new File(repo, 'scripts/android/prepare-studio-inputs.py'), generated.get().asFile
    if (bundleSupport) args '--bundle-support'
}

android {
    namespace 'com.opensaab.tech2'
    compileSdk 36
    defaultConfig {
        applicationId 'com.opensaab.tech2'
        minSdk 26
        targetSdk 36
        versionCode providers.gradleProperty('appVersionCode').map { it.toInteger() }.getOrElse(101011)
        versionName providers.gradleProperty('appVersionName').getOrElse('0.1.1-preview.11')
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        java.srcDirs = [new File(repo, 'android/tech2-app'), new File(repo, 'android/shared'),
                        new File(repo, 'android/adapters/chipsoft'), new File(repo, 'android/adapters/vcx_nano'), new File(repo, 'android/adapters/mdi')]
        java.exclude 'res/**'
        res.srcDirs = [new File(repo, 'android/tech2-app/res')]
        manifest.srcFile generated.map { it.file('AndroidManifest.xml') }.get().asFile
        assets.srcDirs = [generated.map { it.dir('assets') }.get().asFile]
        jniLibs.srcDirs = [generated.map { it.dir('jniLibs') }.get().asFile]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        preview {
            storeFile file(new File(System.getProperty('user.home'), '.local/share/opensaab/release-signing/opensaab-release.p12'))
            storePassword new File(System.getProperty('user.home'), '.local/share/opensaab/release-signing/password.txt').text.trim()
            keyAlias 'opensaab-release'
            keyPassword storePassword
        }
    }
    buildTypes {
        debug { debuggable true; signingConfig signingConfigs.preview }
        release { debuggable false; minifyEnabled false }
    }
    packaging.jniLibs {
        useLegacyPackaging = true
        // Standalone Rust executables: preserve available native symbols.
        keepDebugSymbols += ['**/*.so']
    }
}
tasks.named('preBuild') { dependsOn 'prepareAndroidInputs' }
tasks.register('verifyDebugApk', Exec) {
    dependsOn 'assembleDebug'
    workingDir repo
    commandLine python, new File(repo, 'scripts/android/check-apk-firmware.py'),
        layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile
    args '--native-baseline',new File(repo,'android/tech2-app/native-payload-baseline.json')
    if (bundleSupport) args '--allow-bundled-support'
    doFirst {
        args '--mx-core-sha256', new File(repo,'target/mx-native/aarch64-linux-android/release/tech2-emu').bytes.digest('SHA-256')
        args '--recovered-core-sha256', new File(repo,'core-recovered/emulator/target/aarch64-linux-android/release/tech2-emu').bytes.digest('SHA-256')
        args '--mdi-module-sha256', new File(repo,'retained-native/libopensaab_mdi_android.so').bytes.digest('SHA-256')
        args '--mdi-bridge-sha256', new File(repo,'retained-native/libtech2_mdi.so').bytes.digest('SHA-256')
    }
    def connectionCore = providers.environmentVariable('OPENSAAB_VLINKER_CONNECTION_CORE').orElse(providers.environmentVariable('OPENSAAB_SIMULATOR_CONNECTION_CORE')).getOrElse(new File(repo,'retained-native/libopensaab_connection.so').path)
    doFirst { args '--connection-core-sha256', new File(connectionCore).bytes.digest('SHA-256') }
}
tasks.register('buildMdiMcpBridge', Exec) {
    workingDir repo
    environment 'ANDROID_NDK_HOME', providers.environmentVariable('ANDROID_NDK_HOME').getOrElse(new File(android.sdkDirectory, 'ndk/android-ndk-r29').path)
    environment 'PATH', System.getenv('PATH') + File.pathSeparator + new File(System.getProperty('user.home'), '.cargo/bin')
    commandLine 'sh', new File(repo, 'scripts/android/build-mdi-mcp-bridge.sh')
}

// Native report review/rotation state; versions shared with command-line builds.
configurations { reportRuntime }
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.20')
    reportRuntime platform('org.jetbrains.kotlin:kotlin-bom:1.8.20')
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    reportRuntime 'androidx.fragment:fragment:1.6.2'
    reportRuntime 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
}
tasks.register('exportReportDependencies') {
    doLast {
        def destination = file(project.property('reportDependencyOutput'))
        destination.parentFile.mkdirs()
        def artifacts = configurations.reportRuntime.resolvedConfiguration.resolvedArtifacts
            .collect { [coordinate: it.moduleVersion.id.toString(), path: it.file.absolutePath] }
            .sort { it.coordinate }
        destination.text = groovy.json.JsonOutput.toJson(artifacts)
    }
}

tasks.register('buildRecoveredCore', Exec) {
    workingDir repo
    environment 'ANDROID_NDK_HOME', providers.environmentVariable('ANDROID_NDK_HOME').getOrElse(new File(android.sdkDirectory, 'ndk/android-ndk-r29').path)
    environment 'PATH', System.getenv('PATH') + File.pathSeparator + new File(System.getProperty('user.home'), '.cargo/bin')
    commandLine 'sh', new File(repo, 'scripts/android/build-recovered-core.sh')
}

tasks.register('buildMxCore', Exec) {
    workingDir repo
    environment 'ANDROID_NDK_HOME', providers.environmentVariable('ANDROID_NDK_HOME')
        .getOrElse(new File(android.sdkDirectory, 'ndk/android-ndk-r29').path)
    environment 'PATH', System.getenv('PATH') + File.pathSeparator + new File(System.getProperty('user.home'), '.cargo/bin')
    commandLine 'sh', new File(repo, 'scripts/android/build-mx-core.sh')
}
