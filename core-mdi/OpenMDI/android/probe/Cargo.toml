[package]
name = "openmdi-android-probe"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.10"
openmdi = { path = "../.." }
serde_json = "1.0"
libc = "=0.2.190"
jni = "=0.21.1"
smoltcp = { version = "=0.12.0", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp"] }
