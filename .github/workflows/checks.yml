# SPDX-License-Identifier: MPL-2.0
name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Rust tests without firmware or GUI
        run: cargo +1.98.0 test --locked --no-default-features
      - name: Java protocol, report and request-gate tests
        run: JAVA_HOME="$JAVA_HOME_17_X64" python3 scripts/android/test-request-gate.py
