[package]
name = "tech2-emu"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0 AND LGPL-3.0-only"
rust-version = "1.93"
default-run = "tech2-emu"

[features]
default = ["gui"]
gui = ["dep:minifb"]
load-test = []

[dependencies]
opensaab-session-evidence = { path = "shared/session-evidence" }
m68k = { version = "0.12.1", features = ["serde"] }
serde_json = "1.0"
minifb = { version = "0.25", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
